name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # CI: Get source code
      - name: Checkout
        uses: actions/checkout@v5

      # CI: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # CI: Install dependencies
      - name: Install dependencies
        run: npm ci

      # CI: Build Preact application
      - name: Build application
        run: npm run build

      # Docker: Build production image
      - name: Build Docker image
        run: docker build -t preact-site:latest .

      # Docker: Start website
      - name: Start Docker container
        run: |
          docker run -d \
            --name preact-site \
            -p 8080:80 \
            preact-site:latest

      # Verify website
      - name: Verify website
        run: |
          sleep 2
          curl --fail http://localhost:8080

      # Show container
      - name: Container status
        run: docker ps
